const money = n => '$' + Math.round(n).toLocaleString('en-US');
const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// 3D Scene Component powered by Three.js
function Scene({ on, progress }) {
  const mount = useRef(null);
  const S = useRef({ on, progress });
  S.current.on = on; 
  S.current.progress = progress;

  useEffect(() => {
    const el = mount.current;
    if (!el) return;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x334155, 1.1));
    const sun = new THREE.DirectionalLight(0xffedd5, 1.2);
    sun.position.set(12, 24, 10);
    scene.add(sun);

    const mat = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.7 });

    // Main Mountain
    const H = 10, R = 5.2;
    const mg = new THREE.ConeGeometry(R, H, 12, 8);
    mg.translate(0, H / 2, 0);
    const pos = mg.attributes.position, cols = [];
    const cg = new THREE.Color(0x22543d); // Alpine green bottom
    const cr = new THREE.Color(0x64748b); // Slate rock
    const cs = new THREE.Color(0xffffff); // Himalayan snow cap
    const c = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i), x = pos.getX(i), z = pos.getZ(i);
      if (y > 0.1 && y < H - 0.1) {
        const n = Math.sin(x * 2.8 + z * 2.1 + y) * 0.16;
        pos.setX(i, x + n);
        pos.setZ(i, z - n);
      }
      const t = y / H;
      if (t < 0.28) c.copy(cg);
      else if (t < 0.58) c.copy(cg).lerp(cr, (t - 0.28) / 0.3);
      else if (t < 0.7) c.copy(cr);
      else c.copy(cr).lerp(cs, Math.min(1, (t - 0.7) / 0.12));
      cols.push(c.r, c.g, c.b);
    }
    mg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    mg.computeVertexNormals();
    scene.add(new THREE.Mesh(mg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true })));

    // Ground Base
    const ground = new THREE.Mesh(new THREE.CircleGeometry(45, 32), mat(0x1e293b));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Surrounding Himalayan Peaks
    [[-12, 0, -5, 3.8, 7], [11, 0, -9, 4.2, 8.5], [-8, 0, -12, 3.5, 6]].forEach(([x, y, z, r, h]) => {
      const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), mat(0x475569));
      m.position.set(x, h / 2, z);
      scene.add(m);
    });

    // Pine Trees at lower elevation
    for (let i = 0; i < 20; i++) {
      const a = i * 1.8, d = 8.5 + (i * 5 % 5);
      const t = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 5), mat(0x14532d));
      t.position.set(Math.sin(a) * d, 0.75, Math.cos(a) * d);
      scene.add(t);
    }

    // Authentic Nepalese Summit Flag (Dual Pennant shape)
    const flagGroup = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6), mat(0xe2e8f0));
    pole.position.y = 0.6;
    flagGroup.add(pole);

    // Upper and lower triangular pennants for Nepal Flag
    const pennantMat = mat(0xc51d24);
    const p1 = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.4, 3), pennantMat);
    p1.rotation.z = -Math.PI / 2;
    p1.position.set(0.2, 0.9, 0);
    flagGroup.add(p1);

    const p2 = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.45, 3), pennantMat);
    p2.rotation.z = -Math.PI / 2;
    p2.position.set(0.2, 0.55, 0);
    flagGroup.add(p2);

    flagGroup.position.set(0, H + 0.1, 0);
    scene.add(flagGroup);

    // Ambient floating clouds
    const clouds = [];
    for (let i = 0; i < 6; i++) {
      const g = new THREE.Group();
      for (let j = 0; j < 3; j++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.8 + j * 0.25, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, flatShading: true }));
        s.position.x = j * 1.0;
        g.add(s);
      }
      g.position.set(-18 + i * 7, 6.5 + (i % 3) * 2, -6 - (i % 2) * 5);
      scene.add(g);
      clouds.push(g);
    }

    // Interactive Climber Avatar
    const climber = new THREE.Group();
    const body = new THREE.Group();
    body.scale.setScalar(0.85);
    climber.add(body);
    scene.add(climber);

    const addObj = (p, geo, col, x, y, z) => {
      const m = new THREE.Mesh(geo, mat(col));
      m.position.set(x || 0, y || 0, z || 0);
      p.add(m);
      return m;
    };

    addObj(body, new THREE.BoxGeometry(0.5, 0.6, 0.3), 0x0f172a, 0, 1, 0); // Jacket Base
    addObj(body, new THREE.SphereGeometry(0.18, 12, 10), 0xfbd5b5, 0, 1.5, 0); // Head

    const mkLimb = (x, y, len, w, col) => {
      const p = new THREE.Group();
      p.position.set(x, y, 0);
      addObj(p, new THREE.BoxGeometry(w, len, w), col, 0, -len / 2, 0);
      body.add(p);
      return p;
    };

    const legL = mkLimb(-0.13, 0.7, 0.62, 0.18, 0x1e293b);
    const legR = mkLimb(0.13, 0.7, 0.62, 0.18, 0x1e293b);
    const armL = mkLimb(-0.33, 1.28, 0.55, 0.14, 0x0f172a);
    const armR = mkLimb(0.33, 1.28, 0.55, 0.14, 0x0f172a);

    // Equipment Pieces dynamically attached
    const G = {};
    const reg = (id, o) => {
      G[id] = (Array.isArray(o) ? o : [o]);
      G[id].forEach(x => x.scale.setScalar(0.001));
    };

    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.21, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xc51d24));
    helmet.position.y = 1.52;
    body.add(helmet);
    reg('helmet', helmet);

    const gg = new THREE.Group();
    gg.position.y = 1.51;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 6, 16), mat(0x0284c7));
    ring.rotation.x = Math.PI / 2;
    gg.add(ring);
    addObj(gg, new THREE.BoxGeometry(0.26, 0.08, 0.05), 0x0f172a, 0, 0, 0.18);
    body.add(gg);
    reg('goggles', gg);

    const jacket = addObj(body, new THREE.BoxGeometry(0.6, 0.55, 0.36), 0xd97706, 0, 1.05, 0);
    reg('jacket', jacket);

    const gl = [armL, armR].map(a => addObj(a, new THREE.SphereGeometry(0.11, 8, 6), 0x991b1b, 0, -0.58, 0));
    reg('gloves', gl);

    const bp = new THREE.Group();
    bp.position.set(0, 1.05, -0.28);
    addObj(bp, new THREE.BoxGeometry(0.44, 0.6, 0.28), 0x0284c7);
    addObj(bp, new THREE.BoxGeometry(0.36, 0.15, 0.24), 0x0369a1, 0, 0.37, 0);
    body.add(bp);
    reg('backpack', bp);

    const bt = [legL, legR].map(l => addObj(l, new THREE.BoxGeometry(0.23, 0.18, 0.36), 0x451a03, 0, -0.64, 0.06));
    reg('boots', bt);

    const axe = new THREE.Group();
    axe.position.set(0, -0.55, 0.1);
    addObj(axe, new THREE.CylinderGeometry(0.025, 0.025, 0.95, 6), 0xd97706);
    addObj(axe, new THREE.BoxGeometry(0.32, 0.06, 0.05), 0x94a3b8, 0, 0.47, 0);
    armR.add(axe);
    reg('iceaxe', axe);

    const rope = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.045, 6, 20), mat(0xf59e0b));
    rope.rotation.x = Math.PI / 2;
    rope.position.y = 0.85;
    body.add(rope);
    reg('rope', rope);

    const anim = {}, prev = {};
    let disp = 0, t0 = performance.now(), raf;
    const camT = new THREE.Vector3(), look = new THREE.Vector3(), cp = new THREE.Vector3();

    const resize = () => {
      const w = el.clientWidth || 300, h = el.clientHeight || 300;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize);
    ro.observe(el);
    resize();

    const loop = (now) => {
      raf = requestAnimationFrame(loop);
      const t = (now - t0) / 1000, st = S.current;
      const target = st.progress;
      const moving = Math.abs(target - disp) > 0.0008;
      disp += (target - disp) * 0.06;

      const y = 0.4 + disp * (H - 1.3);
      const r = R * (1 - y / H) + 0.45;
      const th = 0.6 + disp * 10.5;

      climber.position.set(Math.sin(th) * r, y, Math.cos(th) * r);
      climber.lookAt(0, y, 0);
      body.rotation.x = -0.2;

      const ph = t * (moving ? 7.5 : 1.5);
      const a = moving ? 1 : 0.15;
      legL.rotation.x = -0.9 * Math.max(0, Math.sin(ph)) * a;
      legR.rotation.x = -0.9 * Math.max(0, -Math.sin(ph)) * a;
      armL.rotation.x = -2.3 + Math.sin(ph) * 0.4 * a;
      armR.rotation.x = -2.3 - Math.sin(ph) * 0.4 * a;

      GEAR.forEach(g => {
        const active = !!st.on[g.id];
        if (prev[g.id] !== active) {
          prev[g.id] = active;
          anim[g.id] = { t0: t, on: active };
        }
        const an = anim[g.id];
        if (!an) return;
        const k = Math.min(1, (t - an.t0) / 0.55);
        const s = an.on ? easeBack(k) : 1 - k;
        G[g.id].forEach(o => o.scale.setScalar(Math.max(0.001, s)));
      });

      const narrow = camera.aspect < 1 ? 4 : 0;
      const tc = th + 0.9, rc = r + 7.5 + narrow;
      camT.set(Math.sin(tc) * rc, y + 2.5 + narrow * 0.3, Math.cos(tc) * rc);
      cp.lerp(camT, 0.05);
      camera.position.copy(cp);
      look.lerp(climber.position, 0.08);
      camera.lookAt(look.x, look.y + 0.5, look.z);

      clouds.forEach((c, i) => {
        c.position.x += 0.004 * (1 + i * 0.2);
        if (c.position.x > 22) c.position.x = -22;
      });

      flagGroup.rotation.y = Math.sin(t * 2) * 0.25;
      renderer.render(scene, camera);
    };

    camera.position.set(8, 3, 10);
    cp.copy(camera.position);
    look.set(0, 1, 0);
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.dispose();
      if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
    };
  }, []);

  return <div ref={mount} className="absolute inset-0 w-full h-full" role="img" aria-label="3D mountaineer interactive model" />;
}

// Custom Toggle Component
function Toggle({ label, checked, onChange }) {

  const [days, setDays] = useState(peak.days);

  const [guide, setGuide] = useState(true);
  const [porter, setPorter] = useState(true);
  const [ins, setIns] = useState(true);
  const [toasts, setToasts] = useState([]);
  const timers = useRef([]);

  // Mountain Explorer State
  const [selectedMountain, setSelectedMountain] = useState(MOUNTAINS_BLOG[0]);
  const [showVideoModal, setShowVideoModal] = useState(false);
  const [activeWaypoint, setActiveWaypoint] = useState(null);

  const [contactData, setContactData] = useState({
    name: '', email: '', trek: 'Everest Base Camp', dates: '', experience: 'Beginner', message: ''
  });
  const [submitted, setSubmitted] = useState(false);

  // FAQ Accordion State
  const [openFaq, setOpenFaq] = useState(0);

  useEffect(() => {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [theme]);

  // Handle climbing animation loop
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setProgress(p => {
      if (p >= 1) { setPlaying(false); return 1; }
      return Math.min(1, p + 0.005);
    }), 50);
    return () => clearInterval(id);
  }, [playing]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const notify = (text) => {
    const key = Math.random();
    setToasts(t => [...t.slice(-2), { key, text }]);
    timers.current.push(setTimeout(() => setToasts(t => t.filter(x => x.key !== key)), 2500));
  };

  const mult = mode === 'rent' ? 0.25 : 1;
  const setGear = (g, v) => {
    setOn(o => ({ ...o, [g.id]: v }));
    if (v) notify(`${g.icon} ${g.name} equipped (+${money(g.price * mult)})`);
  };

  const autoEquip = () => {
    GEAR.forEach((g, i) => timers.current.push(setTimeout(() => setGear(g, true), i * 450)));
    timers.current.push(setTimeout(() => setPlaying(true), GEAR.length * 450 + 200));
  };

  const resetSimulator = () => {
    setOn({});
    setProgress(0);
    setPlaying(false);
  };

  const pickPeak = (id) => {
    setPeakId(id);
    const p = PEAKS.find(x => x.id === id);

  };

  // Cost Calculations
  const gearBase = GEAR.filter(g => on[g.id]).reduce((s, g) => s + g.price, 0);
  const lines = [

  const sub = lines.reduce((s, l) => s + l[1], 0);

                className="absolute inset-0 w-full h-full object-cover"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>

              {/* Header Floating Info */}
              <div className="relative z-10 space-y-4 max-w-3xl">
                <div className="flex flex-wrap items-center gap-3">
                  <span className="glass-pill px-3 py-1 rounded-full text-xs font-bold text-amber-300 uppercase tracking-widest">
                    Himalayan Peak Showcase
                  </span>
                  <button 
                    onClick={() => setShowVideoModal(true)}
                    className="glass-pill px-3 py-1 rounded-full text-xs font-bold text-white hover:bg-white/20 transition flex items-center gap-1.5"
                  >
                    <span>▶ Watch Video Preview</span>
                  </button>
                </div>

                <div className="space-y-1">
                  <span className="text-sm font-bold text-amber-400 block tracking-widest uppercase">Discover the beauty of</span>
                  <h1 className="font-cinzel text-5xl sm:text-7xl font-black text-white tracking-wide">
                    {selectedMountain.name}
                  </h1>
                  <span className="text-lg text-slate-300 font-medium block">{selectedMountain.nepaliName}</span>
                </div>

                <p className="text-sm sm:text-base text-slate-200 leading-relaxed pt-2">
                  {selectedMountain.description}
                </p>

                {/* STATS STRIP (Matching design layout in user reference) */}
                <div className="grid grid-cols-3 gap-4 pt-6 max-w-lg">
                  <div className="glass-pill p-3.5 rounded-2xl text-center">
                    <span className="serif text-2xl font-black text-white block">{selectedMountain.elevation}</span>
                    <span className="text-[10px] text-amber-300 uppercase font-bold tracking-wider">Height</span>
                  </div>
                  <div className="glass-pill p-3.5 rounded-2xl text-center">
                    <span className="serif text-2xl font-black text-white block">{selectedMountain.temp}</span>
                    <span className="text-[10px] text-amber-300 uppercase font-bold tracking-wider">Avg Temp</span>
                  </div>
                  <div className="glass-pill p-3.5 rounded-2xl text-center">
                    <span className="serif text-2xl font-black text-white block">Sherpa</span>
                    <span className="text-[10px] text-amber-300 uppercase font-bold tracking-wider">Highland Zone</span>
                  </div>
                </div>
              </div>
            </div>

            {/* THREE MOUNTAINS SELECTOR CARDS GRID (From reference image layout) */}
            <div className="space-y-6">
              <div className="flex justify-between items-end">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-[var(--acc-gold)]">Explorer Gallery</span>
                  <h2 className="serif text-3xl font-extrabold">Popular Trek & Summit Peaks</h2>
                </div>
              </div>

              <div className="grid md:grid-cols-3 gap-6">
                {MOUNTAINS_BLOG.map(m => (
                  <button
                    key={m.id}
                    onClick={() => setSelectedMountain(m)}
                    className={`card overflow-hidden text-left transition-all duration-300 hover:shadow-xl group ${
                      selectedMountain.id === m.id ? 'ring-2 ring-[var(--acc)] border-transparent scale-[1.02]' : ''
                    }`}
                  >
                    <div className="relative h-64 overflow-hidden">
                      <img src={m.image} alt={m.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                      <div className="absolute bottom-4 left-4 right-4 text-white">
                        <span className="text-xs text-amber-300 font-bold block">{m.elevation}</span>
                        <h3 className="serif text-xl font-bold">{m.name}</h3>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* VIDEO MODAL BANNER SECTION */}
            <div className="card p-8 bg-slate-950 text-white relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-8 rounded-3xl shadow-2xl">
              <div className="space-y-3 z-10 max-w-xl">
                <span className="text-xs uppercase font-bold text-amber-400 tracking-widest">Video Showcase</span>
                <h3 className="serif text-3xl font-extrabold text-white">The Beauty of Everest & Himalayan Summits</h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Immerse yourself in high-definition aerial footage, ridge traverses, and the legendary Khumbu glacier landscape.
                </p>
                <button 
                  onClick={() => setShowVideoModal(true)} 
                  className="btn bg-white text-slate-950 font-bold text-xs py-3 px-6 hover:bg-amber-400 transition inline-flex items-center gap-2 mt-2"
                >
                  <span>▶ Play Expedition Video</span>
                </button>
              </div>

              <div className="relative w-full md:w-80 h-48 rounded-2xl overflow-hidden group cursor-pointer border border-white/20" onClick={() => setShowVideoModal(true)}>
                <img src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=800&q=80" alt="Video preview thumbnail" className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                  <div className="w-14 h-14 rounded-full bg-white/90 text-slate-950 flex items-center justify-center font-bold text-xl shadow-xl group-hover:scale-110 transition">
                    ▶
                  </div>
                </div>
              </div>
            </div>

            {/* INTERACTIVE ROUTE MAP: "To The Top Of The World" (Inspired by the User's Image) */}
            <section className="space-y-6">
              <div className="text-center max-w-2xl mx-auto space-y-2">
                <span className="text-xs font-bold uppercase tracking-widest text-[var(--acc-gold)]">The Classic South Col Trail</span>
                <h2 className="serif text-3xl sm:text-4xl font-extrabold">To The Top Of The World</h2>
                <p className="text-xs text-[var(--mut)]">
                  Click waypoints to inspect altitude checkpoints on the route from Basecamp to the 8,848m summit.
                </p>
              </div>

              <div className="card p-6 md:p-10 bg-gradient-to-b from-sky-950/10 to-slate-950/20 border-2 border-[var(--line)] space-y-8">
                {/* Route Visualizer Flow */}
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                  {ROUTE_STAGES.map((stg, i) => (
                    <button
                      key={stg.name}
                      onClick={() => setActiveWaypoint(stg)}
                      className={`p-4 rounded-2xl border text-left transition-all relative ${
                        activeWaypoint?.name === stg.name 
                          ? 'border-[var(--acc)] bg-red-500/10 ring-2 ring-[var(--acc)]' 
                          : 'border-[var(--line)] bg-[var(--card)] hover:border-[var(--acc)]'
                      }`}
                    >
                      <span className="text-[10px] font-black uppercase tracking-wider text-[var(--acc-gold)] block">Stage 0{i+1}</span>
                      <span className="serif text-base font-bold text-[var(--ink)] block mt-0.5">{stg.name}</span>
                      <span className="text-xs font-extrabold text-[var(--acc)] block mt-1">{stg.alt}</span>
                    </button>
                  ))}
                </div>

                {/* Waypoint Details Modal Box */}
                {activeWaypoint && (
                  <div className="p-5 rounded-2xl bg-[var(--card)] border border-[var(--acc)] shadow-lg space-y-2 animate-fadeIn">
                    <div className="flex justify-between items-center">
                      <span className="serif text-xl font-bold text-[var(--ink)]">{activeWaypoint.name} ({activeWaypoint.alt})</span>
                      <button onClick={() => setActiveWaypoint(null)} className="text-xs text-[var(--mut)] hover:text-[var(--ink)]">✕ Close</button>
                    </div>
                    <p className="text-xs text-[var(--mut)] leading-relaxed">{activeWaypoint.desc}</p>
                  </div>
                )}
              </div>
            </section>

          </div>
        )}

        {/* ========================================================= */}
        {/* PAGE 4: CONTACT BASECAMP & FAQ PAGE */}
        {/* ========================================================= */}
        {currentPage === 'contact' && (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12 space-y-16">
            
            <div className="text-center max-w-2xl mx-auto space-y-3">
              <span className="text-xs font-bold uppercase tracking-widest text-[var(--acc-gold)]">Get In Touch</span>
              <h1 className="serif text-4xl sm:text-5xl font-black">Contact Expedition Basecamp</h1>
              <p className="text-sm text-[var(--mut)]">
                Our Kathmandu & Pokhara team is on standby to tailor your climbing itinerary, issue permits, and verify gear lists.
              </p>
            </div>

            <div className="grid lg:grid-cols-2 gap-10 items-start">
              
              {/* Contact Form */}
              <section className="card p-6 md:p-8 space-y-6 border-2 border-[var(--line)]">
                <h2 className="serif text-2xl font-bold text-[var(--ink)]">Send Us an Inquiry</h2>

                {submitted ? (
                  <div className="p-6 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-800 dark:text-emerald-300 text-center space-y-2">
                    <span className="text-3xl block">🙏</span>
                    <h3 className="serif text-xl font-bold">Dhanyabad! Inquiry Received</h3>
                    <p className="text-xs">Our Sherpa expedition lead will contact you within 12 hours via email/WhatsApp.</p>
                  </div>
                ) : (
                  <form onSubmit={handleContactSubmit} className="space-y-4 text-xs font-medium">
                    <div>
                      <label className="block mb-1 font-bold text-[var(--ink)]">Full Name *</label>
                      <input 
                        required
                        type="text" 
                        placeholder="Tenzing Norgay"
                        value={contactData.name}
                        onChange={e => setContactData({ ...contactData, name: e.target.value })}
                        className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)]"
                      />
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block mb-1 font-bold text-[var(--ink)]">Email Address *</label>
                        <input 
                          required
                          type="email" 
                          placeholder="climber@expedition.com"
                          value={contactData.email}
                          onChange={e => setContactData({ ...contactData, email: e.target.value })}
                          className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)]"
                        />
                      </div>
                      <div>
                        <label className="block mb-1 font-bold text-[var(--ink)]">Select Trek / Peak</label>
                        <select 
                          value={contactData.trek}
                          onChange={e => setContactData({ ...contactData, trek: e.target.value })}
                          className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)] font-semibold"
                        >
                          <option value="Everest Base Camp">Everest Base Camp (5,364m)</option>
                          <option value="Lobuche Peak">Lobuche East (6,119m)</option>
                          <option value="Island Peak">Island Peak (6,189m)</option>
                          <option value="Annapurna Circuit">Annapurna Base Camp (4,130m)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block mb-1 font-bold text-[var(--ink)]">Target Trekking Dates</label>
                        <input 
                          type="text" 
                          placeholder="e.g. October 2026"
                          value={contactData.dates}
                          onChange={e => setContactData({ ...contactData, dates: e.target.value })}
                          className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)]"
                        />
                      </div>
                      <div>
                        <label className="block mb-1 font-bold text-[var(--ink)]">Climbing Experience</label>
                        <select 
                          value={contactData.experience}
                          onChange={e => setContactData({ ...contactData, experience: e.target.value })}
                          className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)]"
                        >
                          <option value="Beginner">First Time in Himalayas</option>
                          <option value="Intermediate">Trekking up to 5,000m</option>
                          <option value="Advanced">Experienced Mountaineer</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1 font-bold text-[var(--ink)]">Special Requests / Questions</label>
                      <textarea 
                        rows="4" 
                        placeholder="Tell us about your fitness level, dietary needs, or gear questions..."
                        value={contactData.message}
                        onChange={e => setContactData({ ...contactData, message: e.target.value })}
                        className="w-full p-3 rounded-xl border border-[var(--line)] bg-[var(--bg)] text-[var(--ink)]"
                      ></textarea>
                    </div>

                    <button type="submit" className="btn btn-p w-full py-3.5 text-sm font-bold shadow-md">
                      Submit Expedition Inquiry →
                    </button>
                  </form>
                )}
              </section>

              {/* Office Locations & Quick Contact Cards */}
              <div className="space-y-6">
                
                {/* Office Hubs */}
                <div className="card p-6 space-y-4">
                  <h3 className="serif text-xl font-bold">📍 Himalayan Basecamp Offices</h3>
                  
                  <div className="space-y-4 text-xs">
                    <div className="p-3.5 rounded-xl border border-[var(--line)] bg-[var(--bg)] space-y-1">
                      <span className="font-bold text-[var(--acc)] block">Kathmandu HQ Office</span>
                      <p className="text-[var(--ink)] font-medium">Thamel Marg, Ward 26, Kathmandu, Nepal</p>
                      <span className="text-[var(--mut)] block">+977 1-4700000 | info@summitledger.np</span>
                    </div>

                    <div className="p-3.5 rounded-xl border border-[var(--line)] bg-[var(--bg)] space-y-1">
                      <span className="font-bold text-[var(--acc-gold)] block">Pokhara Lakeside Hub</span>
                      <p className="text-[var(--ink)] font-medium">Lakeside Road, Pokhara 33700, Nepal</p>
                      <span className="text-[var(--mut)] block">+977 61-460000</span>
                    </div>
                  </div>
                </div>

                {/* Emergency SAR Box */}
                <div className="card p-6 bg-red-600 text-white space-y-2 shadow-xl">
                  <span className="text-[10px] uppercase font-bold tracking-widest text-red-200">24/7 High-Altitude Emergency</span>
                  <h4 className="serif text-xl font-black">Search & Rescue Helpline</h4>
                  <p className="text-xs text-red-100">Direct helicopter dispatch and medical coordination hotline in Nepal.</p>
                  <span className="serif text-2xl font-black block tracking-wider pt-1">+977 980-0000000</span>
                </div>

                {/* Direct WhatsApp Button */}
                <a 
                  href="https://wa.me/" 
                  target="_blank" 
                  rel="noreferrer" 
                  className="btn bg-emerald-600 text-white hover:bg-emerald-700 w-full py-3.5 font-bold text-xs flex items-center justify-center gap-2 rounded-2xl shadow-lg border-transparent"
                >
                  <span>💬 Chat Directly on WhatsApp</span>
                </a>
              </div>

            </div>

            {/* PERMITS & TREKKING FAQ ACCORDION */}
            <section className="card p-6 md:p-10 space-y-6">
              <div className="text-center max-w-xl mx-auto">
                <span className="text-xs font-bold uppercase tracking-widest text-[var(--acc-gold)]">Permits & Regulations</span>
                <h2 className="serif text-2xl sm:text-3xl font-bold mt-1">Frequently Asked Questions</h2>
              </div>

              <div className="space-y-3 max-w-3xl mx-auto">
                {FAQS.map((faq, idx) => (
                  <div key={idx} className="border border-[var(--line)] rounded-2xl overflow-hidden transition-colors">
                    <button
                      onClick={() => setOpenFaq(openFaq === idx ? -1 : idx)}
                      className="w-full p-4 text-left font-bold text-xs sm:text-sm flex justify-between items-center bg-[var(--bg)] hover:text-[var(--acc)]"
                    >
                      <span>{faq.q}</span>
                      <span className="text-base">{openFaq === idx ? '−' : '+'}</span>
                    </button>
                    {openFaq === idx && (
                      <div className="p-4 bg-[var(--card)] text-xs text-[var(--mut)] leading-relaxed border-t border-[var(--line)]">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </section>

          </div>
        )}

      </main>

      {/* VIDEO PREVIEW MODAL */}
      {showVideoModal && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="card max-w-3xl w-full bg-slate-950 text-white overflow-hidden rounded-3xl space-y-4 p-6 relative">
            <div className="flex justify-between items-center">
              <h3 className="serif text-xl font-bold">Everest Himalayan Aerial Expedition</h3>
              <button onClick={() => setShowVideoModal(false)} className="text-xs text-slate-400 hover:text-white font-bold p-1">✕ Close</button>
            </div>
            
            <div className="aspect-video w-full rounded-2xl overflow-hidden bg-slate-900 flex items-center justify-center border border-white/10">
              <iframe 
                className="w-full h-full"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0" 
                title="Himalayas Video Preview"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowFullScreen
              ></iframe>
            </div>

            <div className="flex justify-end">
              <button onClick={() => setShowVideoModal(false)} className="btn btn-p text-xs py-2 px-5">Done Watching</button>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <footer className="border-t border-[var(--line)] bg-[var(--card)] py-10 px-4 sm:px-8 text-xs text-[var(--mut)] mt-auto transition-colors">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
          <div className="flex items-center space-x-3">
            <span className="text-xl">🇳🇵</span>
            <div>
              <span className="font-cinzel text-base font-bold text-[var(--ink)] block">Himal Yatra (हिमाल यात्रा)</span>
              <span className="text-[10px] text-[var(--mut)]">Made for Himalayan Trekkers & Climbers</span>
            </div>
          </div>

          <div className="flex flex-wrap justify-center gap-6 text-xs font-semibold">
            <button onClick={() => setCurrentPage('home')} className="hover:text-[var(--acc)]">Home</button>
            <button onClick={() => setCurrentPage('simulator')} className="hover:text-[var(--acc)]">3D Simulator</button>
            <button onClick={() => setCurrentPage('mountains')} className="hover:text-[var(--acc)]">Mountain Explorer</button>
            <button onClick={() => setCurrentPage('contact')} className="hover:text-[var(--acc)]">Contact</button>
          </div>

          <p>© 2026 Summit Ledger Nepal. Plan Smarter, Climb Safely.</p>
        </div>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
